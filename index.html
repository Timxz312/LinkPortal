<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Dashboard</title>
    <!-- Linking the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Portal Dashboard</h1>
            <p>Save and access your unblocked links locally</p>
        </header>

        <!-- Form to Add Links Dynamically -->
        <div class="form-section">
            <form id="linkForm">
                <div class="form-group">
                    <label for="siteName">Website Name</label>
                    <input type="text" id="siteName" placeholder="e.g., Google Proxy" required>
                </div>
                <div class="form-group">
                    <label for="siteUrl">URL / Link</label>
                    <input type="url" id="siteUrl" placeholder="https://example.com" required>
                </div>
                <div class="form-group">
                    <label for="siteCategory">Category</label>
                    <select id="siteCategory">
                        <option value="proxies">Proxies & Unblockers</option>
                        <option value="games">Unblocked Games</option>
                        <option value="apps">Apps & Media</option>
                    </select>
                </div>
                <button type="submit">Add to Dashboard</button>
            </form>
        </div>

        <!-- Display Sections -->
        <h2 class="category-title">🌐 Proxies & Unblockers</h2>
        <div id="proxies" class="grid"></div>

        <h2 class="category-title">🎮 Unblocked Games</h2>
        <div id="games" class="grid"></div>

        <h2 class="category-title">📱 Apps & Media</h2>
        <div id="apps" class="grid"></div>
    </div>

    <!-- Linking the external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
